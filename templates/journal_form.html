{% extends "base.html" %}

{% block content %}
<section class="max-w-3xl mx-auto bg-white rounded-lg shadow-md p-6">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold" style="color: #1F2937;">{{ journal and '일기 수정' or '일기 작성' }}</h2>
        <a href="/journal" class="text-sm text-gray-500 hover:underline">목록으로</a>
    </div>
    {% if error %}
        <div class="mb-4 p-3 rounded-md text-sm" style="background-color: #FEF2F2; color: #DC2626;">
            {{ error }}
        </div>
    {% endif %}
    <form method="post" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-2" style="color: #1F2937;">날짜</label>
                <input type="date" name="date" value="{{ (journal and journal.date.isoformat()) or '' }}" class="w-full p-2 border rounded-md" style="border-color: #E5E7EB;">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2" style="color: #1F2937;">공개 범위</label>
                <select name="visibility" class="w-full p-2 border rounded-md" style="border-color: #E5E7EB;">
                    <option value="private" {% if journal and journal.visibility == 'private' %}selected{% endif %}>나만 보기</option>
                    <option value="friends" {% if journal and journal.visibility == 'friends' %}selected{% endif %}>친구 공개</option>
                    <option value="public" {% if journal and journal.visibility == 'public' %}selected{% endif %}>전체 공개</option>
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium mb-2" style="color: #1F2937;">제목</label>
            <input type="text" name="title" value="{{ journal.title if journal else '' }}" class="w-full p-2 border rounded-md" style="border-color: #E5E7EB;">
        </div>
        <div>
            <label class="block text-sm font-medium mb-2" style="color: #1F2937;">내용 *</label>
            <textarea name="content" rows="10" required class="w-full p-2 border rounded-md" style="border-color: #E5E7EB;">{{ journal.content if journal else '' }}</textarea>
        </div>
        <div class="flex gap-2">
            <button type="submit" class="btn-primary px-6 py-2 text-white rounded-md font-medium transition">저장</button>
            <a href="/journal" class="px-6 py-2 border rounded-md transition" style="border-color: #E5E7EB;">취소</a>
        </div>
    </form>
</section>
{% endblock %}
