<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recorder{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --calm-blue: #2563EB;
            --navy-dark: #1F2937;
        }
        .income-color {
            color: #2563EB; /* 차분한 블루 */
        }
        .expense-color {
            color: #DC2626; /* 부드러운 빨강 */
        }
        .calendar-day {
            min-height: 100px;
            width: 14.28%; /* 7등분 */
        }
        .btn-primary {
            background-color: #2563EB;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1D4ED8;
        }
        .btn-secondary {
            background-color: #1F2937;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #111827;
        }
        .navy-bg {
            background-color: #1F2937;
        }
        .calm-blue-bg {
            background-color: #2563EB;
        }
        .calm-blue-light {
            background-color: #EFF6FF;
        }
    </style>
</head>
<body style="background-color: #F9FAFB;">
    <nav class="navy-bg shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold text-white">Recorder (리코더)</h1>
                <div class="flex gap-2">
                    <a href="/" class="px-3 py-1.5 {% if request.path == '/' %}calm-blue-bg text-white font-medium{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} rounded-md transition">홈</a>
                    <a href="/schedule" class="px-3 py-1.5 {% if request.path == '/schedule' %}calm-blue-bg text-white font-medium{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} rounded-md transition">일정</a>
                    <a href="/finance" class="px-3 py-1.5 {% if request.path == '/finance' %}calm-blue-bg text-white font-medium{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} rounded-md transition">가계부</a>
                    <a href="/exercise" class="px-3 py-1.5 {% if request.path == '/exercise' %}calm-blue-bg text-white font-medium{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} rounded-md transition">운동</a>
                    <a href="/study" class="px-3 py-1.5 {% if request.path == '/study' %}calm-blue-bg text-white font-medium{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} rounded-md transition">공부</a>
                    <a href="/journal" class="px-3 py-1.5 {% if request.path == '/journal' %}calm-blue-bg text-white font-medium{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} rounded-md transition">일기</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
