{% extends "base.html" %}

{% block title %}회원가입 - Recorder{% endblock %}

{% block content %}
<section class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
    <h2 class="text-2xl font-bold mb-6" style="color: #1F2937;">회원가입</h2>
    {% if error %}
        <div class="mb-4 p-3 rounded-md text-sm" style="background-color: #FEF2F2; color: #DC2626;">
            {{ error }}
        </div>
    {% endif %}
    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-2" style="color: #1F2937;">아이디</label>
            <input type="text" name="username" required class="w-full p-2 border rounded-md" style="border-color: #E5E7EB;">
        </div>
        <div>
            <label class="block text-sm font-medium mb-2" style="color: #1F2937;">닉네임 (선택)</label>
            <input type="text" name="nickname" class="w-full p-2 border rounded-md" style="border-color: #E5E7EB;">
        </div>
        <div>
            <label class="block text-sm font-medium mb-2" style="color: #1F2937;">비밀번호</label>
            <input type="password" name="password" required class="w-full p-2 border rounded-md" style="border-color: #E5E7EB;">
        </div>
        <div>
            <label class="block text-sm font-medium mb-2" style="color: #1F2937;">비밀번호 확인</label>
            <input type="password" name="password_confirm" required class="w-full p-2 border rounded-md" style="border-color: #E5E7EB;">
        </div>
        <button type="submit" class="btn-primary w-full py-2 rounded-md font-medium transition">회원가입</button>
    </form>
    <p class="text-sm text-center mt-4" style="color: #6B7280;">
        이미 계정이 있으신가요? <a href="/login" class="text-blue-600 hover:underline">로그인</a>
    </p>
</section>
{% endblock %}
