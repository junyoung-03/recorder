{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <section class="bg-white rounded-lg shadow-xl p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-2xl font-bold" style="color: #1F2937;">📌 운동 기록 전체보기</h2>
            <button onclick="history.back()" class="px-4 py-2 border rounded-md transition" style="border-color: #E5E7EB;">닫기</button>
        </div>

        <form method="get" class="flex items-center gap-2 mb-6">
            <select name="year" class="px-3 py-2 border rounded-md" style="border-color: #E5E7EB;">
                {% for y in year_options %}
                    <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}년</option>
                {% endfor %}
            </select>
            <select name="month" class="px-3 py-2 border rounded-md" style="border-color: #E5E7EB;">
                {% for m in range(1, 13) %}
                    <option value="{{ m }}" {% if m == current_month %}selected{% endif %}>{{ m }}월</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn-primary px-4 py-2 rounded-md font-medium">조회</button>
        </form>

        <div class="grid grid-cols-4 gap-4">
            {% for card in cards %}
            <div class="border rounded-lg p-3 flex flex-col overflow-y-auto" style="border-color: #E5E7EB; min-height: 140px; max-height: 180px;">
                <div class="text-sm font-semibold mb-2" style="color: #1F2937;">
                    {{ card.date.strftime('%m월 %d일') }}
                </div>
                {% if card.records %}
                    <div class="space-y-2">
                        {% for record in card.records %}
                        <div class="text-xs">
                            <div class="font-semibold" style="color: #1F2937;">{{ record.body_part }}</div>
                            <div class="mt-1" style="color: #6B7280; white-space: pre-line;">{{ record.memo or '메모 없음' }}</div>
                        </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <p class="text-xs" style="color: #6B7280;">기록 없음</p>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </section>
</div>
{% endblock %}
